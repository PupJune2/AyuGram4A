name: Build test APK

# Builds an installable debug APK (beta flavor) on GitHub's own runners, so it works in a fork
# without AyuGram's self-hosted runner, private submodule or release signing key.
on:
  push:
    branches:
      - claude/project-thread-g2t4vd   # Aurora Motion PR branch
      - claude/project-thread-top5kt   # this workflow's branch
  workflow_dispatch:
    inputs:
      abi:
        description: "CPU architecture (arm64-v8a fits almost every modern phone)"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - both

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NDK_VERSION: "21.4.7075529"
      CMAKE_VERSION: "3.10.2.4988404"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Use stand-ins for the private proprietary submodule
        run: |
          dir=TMessagesProj/src/main/java/com/radolyn/ayugram/proprietary
          mkdir -p "$dir"
          if [ -z "$(ls -A "$dir")" ]; then
            cp .github/ci/proprietary-stubs/*.java "$dir/"
            echo "Copied CI stand-ins into $dir"
          fi

      - name: Write API_KEYS and test signing key
        env:
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
        run: |
          # Test key only: the real release key (config/extera.jks) needs AyuGram's password.
          cp .github/ci/test-signing.jks TMessagesProj/config/extera.jks
          cat > API_KEYS <<KEYS
          APP_ID = 6
          APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"
          MAPS_V2_API = ${MAPS_KEY:-placeholder-maps-key}
          SIGNING_KEY_PASSWORD = ayugram-test
          SIGNING_KEY_ALIAS = test
          SIGNING_KEY_STORE_PASSWORD = ayugram-test
          KEYS
          sed -i 's/^ *//' API_KEYS

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install NDK, CMake and SDK packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build bison > /dev/null
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "build-tools;33.0.1" "platforms;android-33" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore native build cache
        id: cxx-cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: cxx-${{ inputs.abi || 'arm64-v8a' }}-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/build.gradle') }}

      - name: Mark cached native objects as up to date
        if: steps.cxx-cache.outputs.cache-hit == 'true'
        run: find TMessagesProj/.cxx TMessagesProj/build/intermediates/cxx -exec touch {} + 2>/dev/null || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ABI="${{ inputs.abi || 'arm64-v8a' }}"
          EXTRA=""
          if [ "$ABI" != "both" ]; then EXTRA="-Pandroid.injected.build.abi=$ABI"; fi
          ./gradlew assembleBetaDebug $EXTRA --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-test-apk-${{ github.run_number }}
          path: TMessagesProj/build/outputs/apk/beta/debug/*.apk
          if-no-files-found: error
          retention-days: 14
